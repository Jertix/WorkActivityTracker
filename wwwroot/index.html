<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Work Activity Tracker</title>
    <base href="/" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons (v5.6): icone dei pulsanti di export e delle azioni di riga -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />

    <!-- Tema e colore principale (v5.7). Sta nell'head e riapplica subito l'ultima scelta salvata
         in localStorage: senza, a ogni avvio la pagina comparirebbe chiara e poi diventerebbe scura
         quando Blazor chiama temaHelper.applica (TemaInterfaccia.ApplicaAsync). -->
    <script>
        window.temaHelper = (function () {
            var scelta = null;   // { tema: 'ComeWindows'|'Chiaro'|'Scuro', colore: '#RRGGBB' }
            var schemaScuro = window.matchMedia('(prefers-color-scheme: dark)');

            function rgb(esa) {
                var n = parseInt(esa.replace('#', ''), 16);
                return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
            }
            // Sfuma il colore verso il nero o il bianco della percentuale indicata
            function mescola(c, verso, p) {
                return c.map(function (v, i) { return Math.round(v + (verso[i] - v) * p); });
            }
            function esa(c) {
                return '#' + c.map(function (v) { return v.toString(16).padStart(2, '0'); }).join('');
            }

            function applicaOra() {
                if (!scelta) return;
                var radice = document.documentElement;
                var scuro = scelta.tema === 'Scuro' || (scelta.tema === 'ComeWindows' && schemaScuro.matches);
                radice.setAttribute('data-bs-theme', scuro ? 'dark' : 'light');

                // Le stesse proporzioni di Bootstrap: hover -15%, premuto -20% verso il nero;
                // versione chiara (testo e link nel tema scuro) +40%, bordo del focus +50% verso il bianco
                var c = rgb(scelta.colore || '#0d6efd'), nero = [0, 0, 0], bianco = [255, 255, 255];
                var chiaro = mescola(c, bianco, 0.4);
                var s = radice.style;
                s.setProperty('--wat-primario', esa(c));
                s.setProperty('--wat-primario-rgb', c.join(', '));
                s.setProperty('--wat-primario-hover', esa(mescola(c, nero, 0.15)));
                s.setProperty('--wat-primario-attivo', esa(mescola(c, nero, 0.2)));
                s.setProperty('--wat-primario-chiaro', esa(chiaro));
                s.setProperty('--wat-primario-chiaro-rgb', chiaro.join(', '));
                s.setProperty('--wat-primario-bordo', esa(mescola(c, bianco, 0.5)));
            }

            // "Come Windows": segue il passaggio chiaro/scuro di Windows anche a programma aperto
            schemaScuro.addEventListener('change', applicaOra);

            return {
                applica: function (tema, colore) {
                    scelta = { tema: tema, colore: colore };
                    applicaOra();
                    try { localStorage.setItem('wat-tema', JSON.stringify(scelta)); } catch (e) { }
                },
                ripristina: function () {
                    try { scelta = JSON.parse(localStorage.getItem('wat-tema') || 'null'); } catch (e) { scelta = null; }
                    applicaOra();
                }
            };
        })();
        temaHelper.ripristina();
    </script>
</head>
<body>
    <div id="app">Caricamento...</div>

    <div id="blazor-error-ui">
        Si è verificato un errore. Ricarica la pagina.
        <a href="" class="reload">Ricarica</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Copia negli appunti (fallback compatibile con MAUI WebView) -->
    <script>
        window.copyToClipboard = function (text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).catch(function () {
                    window.copyToClipboardFallback(text);
                });
            } else {
                window.copyToClipboardFallback(text);
            }
        };
        window.copyToClipboardFallback = function (text) {
            var textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.top = '0';
            textArea.style.left = '0';
            textArea.style.opacity = '0';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try { document.execCommand('copy'); } catch (e) { }
            document.body.removeChild(textArea);
        };
    </script>

    <!-- Ctrl+S globale: chiama il metodo Blazor registrato -->
    <script>
        window._ctrlSRef = null;
        window._ctrlSModalRef = null;

        window.registraCtrlS = function (dotNetRef) {
            window._ctrlSRef = dotNetRef;
            document.addEventListener('keydown', function (e) {
                if (e.ctrlKey && (e.key === 's' || e.key === 'S')) {
                    e.preventDefault();
                    // @bind di Blazor aggiorna il valore sull'evento change, che parte solo quando il
                    // campo perde il focus: con il cursore ancora nel campo appena modificato
                    // (es. Descrizione) il salvataggio userebbe il testo precedente. blur() genera il
                    // change prima della chiamata a SalvaViaShortcut, focus() rimette il cursore dov'era.
                    // Non serve per gli editor contenteditable: il salvataggio ne legge l'HTML direttamente.
                    var attivo = document.activeElement;
                    if (attivo && (attivo.tagName === 'INPUT' || attivo.tagName === 'TEXTAREA')) {
                        attivo.blur();
                        attivo.focus();
                    }
                    if (window._ctrlSModalRef) {
                        window._ctrlSModalRef.invokeMethodAsync('SalvaViaShortcut');
                    } else if (window._ctrlSRef) {
                        window._ctrlSRef.invokeMethodAsync('SalvaViaShortcut');
                    }
                }
            });
        };

        window.deregistraCtrlS = function () {
            window._ctrlSRef = null;
        };

        window.registraCtrlSModal = function (dotNetRef) {
            window._ctrlSModalRef = dotNetRef;
        };

        window.deregistraCtrlSModal = function () {
            window._ctrlSModalRef = null;
        };
    </script>

    <!-- Traccia la posizione del cursore (riga/colonna interi) negli editor contenteditable.
         Ogni volta che la selezione cambia, salva _savedLine e _savedEndLine sull'elemento.
         Questo è più affidabile dell'oggetto Range che può diventare stale. -->
    <script>
        // Calcola l'indice di riga (0-based) dato un offset carattere nel testo plain
        window._editorGetLines = function (el, range) {
            var startOff = 0, endOff = 0;
            var walker = document.createTreeWalker(el, NodeFilter.SHOW_ALL, null);
            var n;
            var countTo = function (targetNode, targetOffset) {
                var count = 0;
                var w2 = document.createTreeWalker(el, NodeFilter.SHOW_ALL, null);
                var n2;
                while ((n2 = w2.nextNode()) !== null) {
                    if (n2 === targetNode) { count += targetOffset; return count; }
                    if (n2.nodeType === Node.TEXT_NODE) {
                        if (n2.parentNode === el || n2.parentNode.parentNode === el) count += n2.textContent.length;
                    } else if (n2.nodeName === 'BR') {
                        count += 1;
                    }
                }
                return count;
            };
            startOff = countTo(range.startContainer, range.startOffset);
            endOff = countTo(range.endContainer, range.endOffset);
            var plainText = el.innerText.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            var textBefore = plainText.substring(0, startOff);
            var textSelected = plainText.substring(startOff, endOff);
            var startLine = textBefore.split('\n').length - 1;
            var endLine = startLine + (textBefore.split('\n').pop() + textSelected).split('\n').length - 1;
            return { startLine: startLine, endLine: endLine };
        };

        // Aggiorna _savedLine/_savedEndLine ogni volta che il cursore si sposta
        document.addEventListener('selectionchange', function () {
            var activeEl = document.activeElement;
            if (!activeEl || !activeEl.isContentEditable) return;
            if (activeEl.id !== 'note-editor-div' && activeEl.id !== 'changeset-editor-div') return;
            var sel = window.getSelection();
            if (!sel || sel.rangeCount === 0) return;
            var lines = window._editorGetLines(activeEl, sel.getRangeAt(0));
            activeEl._savedLine = lines.startLine;
            activeEl._savedEndLine = lines.endLine;
        });

        // Previene che i bottoni della toolbar (e del pannello icone) rubino il focus
        // al contenteditable: senza questo il cursore si perderebbe al primo click.
        document.addEventListener('mousedown', function (e) {
            if (e.target.closest('.editor-toolbar') || e.target.closest('.emoji-picker')) {
                e.preventDefault();
            }
        }, true);

        // Indenta il Note editor. Chiamata da onclick nativo.
        window.indentNote = function (right) {
            var el = document.getElementById('note-editor-div');
            if (!el) return;
            window.noteEditorHelper.indent(el, right);
        };

        // Indenta il Changeset editor. Chiamata da onclick nativo.
        window.indentChangeset = function (right) {
            var el = document.getElementById('changeset-editor-div');
            if (!el) return;
            window.changesetEditorHelper.indent(el, right);
        };
    </script>

    <!-- Indicatore "modifiche non salvate" (v5.7): segnala a Blazor la PRIMA modifica fatta nel
         form attività dopo che l'attività è stata caricata o salvata, poi si disarma (niente
         chiamate a ogni tasto) finché Blazor non lo riarma.
         - Campi normali (input, select, textarea, checkbox): eventi input/change.
         - Editor Note e Changeset: MutationObserver, perché alcuni comandi della toolbar (indenta,
           rimuovi righe vuote, rimuovi TODO, Tab) riscrivono l'HTML senza generare eventi input.
           Le scritture di setContent (caricamento dell'attività) vengono scartate da scartaModificheEditor. -->
    <script>
        window.modificheFormHelper = {
            _ref: null,
            _armato: false,
            _osservatore: null,

            registra: function (dotNetRef, idContenitore) {
                var contenitore = document.getElementById(idContenitore);
                if (!contenitore) return;
                var self = this;
                self._ref = dotNetRef;
                self._armato = true;

                var suEvento = function () { self._segnala(); };
                contenitore.addEventListener('input', suEvento, true);
                contenitore.addEventListener('change', suEvento, true);

                self._osservatore = new MutationObserver(function (records) {
                    if (records.some(function (r) { return self._dentroEditor(r); })) self._segnala();
                });
                self._osservatore.observe(contenitore,
                    { childList: true, characterData: true, attributes: true, subtree: true });
            },

            // Conta solo le mutazioni DENTRO un editor contenteditable: il resto del form viene
            // ridisegnato da Blazor (classi, badge, sezioni nascoste) e non è una modifica dell'utente.
            // Anche gli attributi della radice dell'editor (class, placeholder) li imposta Blazor.
            _dentroEditor: function (r) {
                var el = r.target.nodeType === Node.ELEMENT_NODE ? r.target : r.target.parentElement;
                if (!el) return false;
                var editor = el.closest('[contenteditable="true"]');
                if (!editor) return false;
                return r.type !== 'attributes' || el !== editor;
            },

            _segnala: function () {
                if (!this._armato || !this._ref) return;
                this._armato = false;
                this._ref.invokeMethodAsync('SegnalaModificaForm');
            },

            // Chiamata da Blazor quando l'indicatore torna verde (attività caricata o salvata)
            riarma: function () {
                this._armato = true;
            },

            // Chiamata da setContent: il contenuto appena caricato non è una modifica dell'utente.
            // takeRecords svuota la coda dell'observer prima che la callback venga eseguita.
            scartaModificheEditor: function () {
                if (this._osservatore) this._osservatore.takeRecords();
            }
        };
    </script>

    <!-- Inserisce testo al cursore nel contenteditable focalizzato -->
    <script>
        window.inserisciTestoACursore = function (el, text) {
            if (!el) return;
            el.focus();
            document.execCommand('insertText', false, text);
        };
    </script>

    <!-- Inserisce HTML al cursore nel contenteditable focalizzato (per separatori colorati) -->
    <script>
        window.inserisciHtmlACursore = function (el, html) {
            if (!el) return;
            el.focus();
            document.execCommand('insertHTML', false, html);
        };
    </script>

    <!-- Navigazione dei TODO dentro un contenteditable.
         Non altera il contenuto (niente marcatori inseriti nell'HTML, che finirebbero nel DB):
         cerca le occorrenze nei text node e ci porta sopra la selezione, poi scrolla l'editor. -->
    <script>
        window.todoNavHelper = {
            // Stessa nozione di "parola isolata" della TodoRegex lato C#.
            _regex: function () { return /(?<![a-zA-Z])TODO(?![a-zA-Z])/gi; },

            // Elenco delle occorrenze come { node, start }.
            _trova: function (el) {
                var occorrenze = [];
                var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null, false);
                var nodo;
                while ((nodo = walker.nextNode())) {
                    var testo = nodo.nodeValue || '';
                    var re = this._regex();
                    var m;
                    while ((m = re.exec(testo)) !== null) {
                        occorrenze.push({ node: nodo, start: m.index });
                    }
                }
                return occorrenze;
            },

            // Quante occorrenze ci sono in questo momento.
            conta: function (el) {
                if (!el) return 0;
                return this._trova(el).length;
            },

            // Sposta la selezione sull'occorrenza precedente/successiva (direzione -1 / +1),
            // con wrap-around, e scrolla l'editor per renderla visibile.
            // indiceCorrente = -1 significa "nessuna occorrenza ancora visitata".
            // Ritorna { indice, totale } per aggiornare il contatore nella toolbar.
            naviga: function (el, direzione, indiceCorrente) {
                if (!el) return { indice: -1, totale: 0 };

                var occ = this._trova(el);
                if (occ.length === 0) return { indice: -1, totale: 0 };

                var i;
                if (indiceCorrente < 0) {
                    i = direzione > 0 ? 0 : occ.length - 1;
                } else {
                    i = (indiceCorrente + direzione) % occ.length;
                    if (i < 0) i += occ.length;
                }

                var o = occ[i];
                var range = document.createRange();
                range.setStart(o.node, o.start);
                range.setEnd(o.node, o.start + 4); // "TODO" = 4 caratteri

                el.focus();
                var sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);

                // Scroll manuale: scrollIntoView sposterebbe anche la pagina intera.
                var r = range.getBoundingClientRect();
                var e = el.getBoundingClientRect();
                if (r.height > 0 || r.width > 0) {
                    el.scrollTop += (r.top - e.top) - (el.clientHeight / 3);
                    if (r.left < e.left || r.right > e.right) {
                        el.scrollLeft += (r.left - e.left) - (el.clientWidth / 3);
                    }
                }

                return { indice: i, totale: occ.length };
            }
        };
    </script>

    <!-- Esegui grassetto (bold) sul contenteditable focalizzato -->
    <script>
        window.eseguiBold = function (el) {
            if (!el) return;
            el.focus();
            document.execCommand('bold');
        };

        // Evidenzia la selezione con il colore specificato (es. 'yellow', 'orange')
        window.eseguiHighlight = function (el, color) {
            if (!el) return;
            el.focus();
            document.execCommand('hiliteColor', false, color);
        };

        // Applica/rimuove il barrato al testo selezionato
        window.eseguiBarrato = function (el) {
            if (!el) return;
            el.focus();
            document.execCommand('strikeThrough');
        };

        // Applica/rimuove il sottolineato al testo selezionato
        window.eseguiSottolineato = function (el) {
            if (!el) return;
            el.focus();
            document.execCommand('underline');
        };

        // Colora il testo selezionato con il colore specificato (es. 'red')
        window.eseguiColoreTesto = function (el, color) {
            if (!el) return;
            el.focus();
            document.execCommand('foreColor', false, color);
        };

        // Rimuove tutta la formattazione (bold, italic, underline, colore, highlight, ecc.)
        window.rimuoviFormattazione = function (el) {
            if (!el) return;
            el.focus();
            document.execCommand('removeFormat');
        };
    </script>

    <!-- Changeset Editor Helper -->
    <script>
        window.changesetEditorHelper = {
            escapeHtml: function (text) {
                return text
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');
            },

            // Imposta il contenuto del div con grassetto per le righe intestazione congelato.
            // Se il contenuto è già HTML (contiene tag), lo imposta direttamente.
            // Se è testo normale, applica la logica heading-bold e converte \n in <br>.
            setContent: function (el, text) {
                if (!el) return;
                // Non sovrascrivere se l'utente sta editando
                if (document.activeElement === el) return;

                if (!text) { el.innerHTML = ''; window.modificheFormHelper.scartaModificheEditor(); return; }

                // Controlla se il contenuto è già HTML (ha tag)
                if (/<[^>]+>/.test(text)) {
                    el.innerHTML = text;
                    window.modificheFormHelper.scartaModificheEditor();
                    return;
                }

                // Testo normale: applica logica heading-bold e converte \n in <br>
                const lines = text.split('\n');
                const htmlParts = lines.map(line => {
                    const escaped = this.escapeHtml(line);
                    // Riga intestazione: formato "NomeQualcosa (x.y.z):" oppure "Sviluppo (x.y.z):"
                    if (/^[^\s].+\([^)]+\):\s*$/.test(line.trim())) {
                        return '<strong>' + escaped + '</strong>';
                    }
                    return escaped || '';
                });
                el.innerHTML = htmlParts.join('<br>');
                window.modificheFormHelper.scartaModificheEditor();
            },

            // Legge il testo grezzo (plain text) normalizzando le newline.
            // Usato per operazioni C# su stringhe (AggiungiBloccoCongelato, ecc.)
            getText: function (el) {
                if (!el) return '';
                return el.innerText.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            },

            // Legge il contenuto HTML (per salvataggio nel DB).
            // Preserva le tag <strong> per il grassetto manuale.
            getHtml: function (el) {
                if (!el) return '';
                return el.innerHTML;
            },

            // Gestisce il tasto Tab per indentare/dedentare
            handleTab: function (e, el) {
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const right = !e.shiftKey;
                    window.changesetEditorHelper.indent(el, right);
                }
            },

            // Indenta o dedenta la riga corrente (aggiunge/rimuove 4 spazi non divisibili)
            indent: function (editor, right) {
                const sel = window.getSelection();
                if (!sel.rangeCount) return;
                const range = sel.getRangeAt(0);
                const container = range.commonAncestorContainer;
                let node = container.nodeType === 3 ? container.parentNode : container;
                while (node && node !== editor) {
                    if (node.tagName === 'DIV' || node.tagName === 'P') break;
                    node = node.parentNode;
                }
                if (!node) node = editor;
                const lines = [];
                if (node === editor) {
                    // Contenuto BR-based: considera solo nodi elemento (ignora text node e BR diretti)
                    lines.push(...Array.from(editor.childNodes).filter(n => n.nodeType === Node.ELEMENT_NODE));
                } else {
                    lines.push(node);
                }
                lines.forEach(l => {
                    if (right) {
                        l.innerHTML = '&nbsp;&nbsp;&nbsp;&nbsp;' + l.innerHTML;
                    } else {
                        if (l.innerHTML.startsWith('&nbsp;&nbsp;&nbsp;&nbsp;')) {
                            l.innerHTML = l.innerHTML.substring(24);
                        }
                    }
                });
            },

            // Rimuove le righe vuote nell'intero editor.
            // Gestisce sia il formato <br>-based (da setContent) che il formato <div>-based
            // che il browser crea dopo un incolla (WebView2/Chrome usa <div> per ogni riga).
            rimuoviRigheVuote: function(el) {
                if (!el) return;
                el.querySelectorAll('div, p').forEach(function(node) {
                    if (node.textContent.replace(/\u00a0/g, '').trim() === '') {
                        node.remove();
                    }
                });
                var html = el.innerHTML;
                html = html.replace(/(<br\s*\/?>){2,}/gi, '<br>');
                html = html.replace(/^(<br\s*\/?>)+/i, '');
                html = html.replace(/(<br\s*\/?>)+$/i, '');
                el.innerHTML = html;
            }
        };
    </script>

    <!-- Note Editor Helper: contenteditable per "Descrizione dettagliata lavoro svolto" -->
    <script>
        window.noteEditorHelper = {
            // Imposta il contenuto del div note.
            // Se è HTML (ha tag) lo imposta direttamente; se è testo normale converte \n in <br>.
            setContent: function (el, html) {
                if (!el) return;
                if (document.activeElement === el) return;
                if (!html) { el.innerHTML = ''; window.modificheFormHelper.scartaModificheEditor(); return; }

                if (/<[^>]+>/.test(html)) {
                    // Già HTML: imposta direttamente
                    el.innerHTML = html;
                } else {
                    // Testo normale: converti \n in <br> e fai escape HTML
                    var escaped = html
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;')
                        .replace(/\n/g, '<br>');
                    el.innerHTML = escaped;
                }
                window.modificheFormHelper.scartaModificheEditor();
            },

            // Legge il contenuto HTML (per salvataggio nel DB con bold preservato)
            getHtml: function (el) {
                if (!el) return '';
                return el.innerHTML;
            },

            // Legge il testo plain (per export, ContieneTodo, ecc.)
            getText: function (el) {
                if (!el) return '';
                return el.innerText.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            },

            // Gestisce il tasto Tab per indentare/dedentare
            handleTab: function (e, el) {
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const right = !e.shiftKey;
                    window.noteEditorHelper.indent(el, right);
                }
            },

            // Indenta o dedenta la riga corrente (aggiunge/rimuove 4 spazi non divisibili)
            indent: function (editor, right) {
                const sel = window.getSelection();
                if (!sel.rangeCount) return;
                const range = sel.getRangeAt(0);
                const container = range.commonAncestorContainer;
                let node = container.nodeType === 3 ? container.parentNode : container;
                while (node && node !== editor) {
                    if (node.tagName === 'DIV' || node.tagName === 'P') break;
                    node = node.parentNode;
                }
                if (!node) node = editor;
                const lines = [];
                if (node === editor) {
                    // Contenuto BR-based: considera solo nodi elemento (ignora text node e BR diretti)
                    lines.push(...Array.from(editor.childNodes).filter(n => n.nodeType === Node.ELEMENT_NODE));
                } else {
                    lines.push(node);
                }
                lines.forEach(l => {
                    if (right) {
                        l.innerHTML = '&nbsp;&nbsp;&nbsp;&nbsp;' + l.innerHTML;
                    } else {
                        if (l.innerHTML.startsWith('&nbsp;&nbsp;&nbsp;&nbsp;')) {
                            l.innerHTML = l.innerHTML.substring(24);
                        }
                    }
                });
            },

            // Rimuove le righe vuote nell'intero editor.
            // Gestisce sia il formato <br>-based (da setContent) che il formato <div>-based
            // che il browser crea dopo un incolla (WebView2/Chrome usa <div> per ogni riga).
            rimuoviRigheVuote: function(el) {
                if (!el) return;
                el.querySelectorAll('div, p').forEach(function(node) {
                    if (node.textContent.replace(/\u00a0/g, '').trim() === '') {
                        node.remove();
                    }
                });
                var html = el.innerHTML;
                html = html.replace(/(<br\s*\/?>){2,}/gi, '<br>');
                html = html.replace(/^(<br\s*\/?>)+/i, '');
                html = html.replace(/(<br\s*\/?>)+$/i, '');
                el.innerHTML = html;
            }
        };
    </script>

    <!-- Collegamento Editor Helper: contenteditable per "Come collegarsi" nella Gestione Clienti (v4.7)
         Dati Ambiente Editor Helper: contenteditable per "Dati recuperati dall'ambiente" (v4.8) -->
    <script>
        window.collegamentoEditorHelper = {
            setContent: function (el, html) {
                if (!el) return;
                if (document.activeElement === el) return;
                if (!html) { el.innerHTML = ''; return; }

                if (/<[^>]+>/.test(html)) {
                    el.innerHTML = html;
                } else {
                    var escaped = html
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;')
                        .replace(/\n/g, '<br>');
                    el.innerHTML = escaped;
                }
            },

            getHtml: function (el) {
                if (!el) return '';
                return el.innerHTML;
            },

            getText: function (el) {
                if (!el) return '';
                return el.innerText.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            },

            handleTab: function (e, el) {
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const right = !e.shiftKey;
                    window.collegamentoEditorHelper.indent(el, right);
                }
            },

            indent: function (editor, right) {
                const sel = window.getSelection();
                if (!sel.rangeCount) return;
                const range = sel.getRangeAt(0);
                const container = range.commonAncestorContainer;
                let node = container.nodeType === 3 ? container.parentNode : container;
                while (node && node !== editor) {
                    if (node.tagName === 'DIV' || node.tagName === 'P') break;
                    node = node.parentNode;
                }
                if (!node) node = editor;
                const lines = [];
                if (node === editor) {
                    lines.push(...Array.from(editor.childNodes).filter(n => n.nodeType === Node.ELEMENT_NODE));
                } else {
                    lines.push(node);
                }
                lines.forEach(l => {
                    if (right) {
                        l.innerHTML = '&nbsp;&nbsp;&nbsp;&nbsp;' + l.innerHTML;
                    } else {
                        if (l.innerHTML.startsWith('&nbsp;&nbsp;&nbsp;&nbsp;')) {
                            l.innerHTML = l.innerHTML.substring(24);
                        }
                    }
                });
            },

            rimuoviRigheVuote: function(el) {
                if (!el) return;
                el.querySelectorAll('div, p').forEach(function(node) {
                    if (node.textContent.replace(/\u00a0/g, '').trim() === '') {
                        node.remove();
                    }
                });
                var html = el.innerHTML;
                html = html.replace(/(<br\s*\/?>){2,}/gi, '<br>');
                html = html.replace(/^(<br\s*\/?>)+/i, '');
                html = html.replace(/(<br\s*\/?>)+$/i, '');
                el.innerHTML = html;
            }
        };

        // datiAmbienteEditorHelper: stessa interfaccia di collegamentoEditorHelper (v4.8)
        window.datiAmbienteEditorHelper = window.collegamentoEditorHelper;
    </script>

    <!-- Sostituisce le occorrenze di TODO (parola isolata) con '--' nei text node dell'editor,
         preservando tutta la formattazione HTML (bold, highlight, colori). -->
    <script>
        window.sostituisciTodoNeiNodi = function (el) {
            if (!el) return;
            var regex = /(?<![a-zA-Z])TODO(?![a-zA-Z])/gi;
            var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
            var nodes = [];
            var node;
            while ((node = walker.nextNode()) !== null) nodes.push(node);
            nodes.forEach(function (n) {
                if (regex.test(n.nodeValue)) {
                    n.nodeValue = n.nodeValue.replace(regex, '--');
                }
            });
        };
    </script>
